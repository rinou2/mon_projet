<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="menuCocktailTitle">
  <title id="menuCocktailTitle">Illustration du menu Cocktail Dînatoire Signature</title>
  <defs>
    <linearGradient id="bgCocktail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3ead9"/>
      <stop offset="100%" stop-color="#e9b799"/>
    </linearGradient>
  </defs>
  <rect width="400" height="210" fill="url(#bgCocktail)"/>
  <circle cx="350" cy="30" r="60" fill="#c96f4a" opacity="0.15"/>

  <!-- coupe glass -->
  <g>
    <path d="M130,70 l30,50 h-60 z" fill="#fbf6ef" opacity="0.9"/>
    <rect x="157" y="120" width="6" height="30" fill="#fbf6ef" opacity="0.9"/>
    <rect x="140" y="150" width="40" height="8" rx="4" fill="#fbf6ef" opacity="0.9"/>
    <circle cx="150" cy="86" r="6" fill="#c96f4a"/>
    <path d="M110,66 q20,-18 40,0" fill="none" stroke="#5c6b4a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- martini glass -->
  <g>
    <path d="M230,60 l40,44 l40,-44 z" fill="#fbf6ef" opacity="0.9"/>
    <rect x="267" y="104" width="6" height="34" fill="#fbf6ef" opacity="0.9"/>
    <rect x="248" y="138" width="44" height="8" rx="4" fill="#fbf6ef" opacity="0.9"/>
    <circle cx="278" cy="70" r="5" fill="#d9a441"/>
  </g>

  <!-- canape plate -->
  <g>
    <ellipse cx="60" cy="170" rx="46" ry="14" fill="#fbf6ef"/>
    <circle cx="42" cy="164" r="9" fill="#a85635"/>
    <circle cx="64" cy="162" r="9" fill="#5c6b4a"/>
    <circle cx="84" cy="166" r="9" fill="#d9a441"/>
  </g>

  <!-- bubbles -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="150" cy="55" r="3"/>
    <circle cx="160" cy="45" r="2"/>
    <circle cx="255" cy="48" r="3"/>
  </g>
</svg>
