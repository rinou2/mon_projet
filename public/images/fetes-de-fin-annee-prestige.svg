<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="menuFetesTitle">
  <title id="menuFetesTitle">Illustration du menu Fêtes de Fin d'Année Prestige</title>
  <defs>
    <linearGradient id="bgFetes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef0e7"/>
      <stop offset="100%" stop-color="#c3cdb4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="210" fill="url(#bgFetes)"/>

  <!-- string lights -->
  <path d="M0,26 Q200,-6 400,26" fill="none" stroke="#d9a441" stroke-width="2" opacity="0.6"/>
  <g fill="#d9a441">
    <circle cx="40" cy="20" r="4"/>
    <circle cx="130" cy="8" r="4"/>
    <circle cx="220" cy="4" r="4"/>
    <circle cx="310" cy="8" r="4"/>
    <circle cx="380" cy="20" r="4"/>
  </g>

  <!-- pine sprig -->
  <g fill="#454f37">
    <path d="M70,180 l14,-70 l14,70 z"/>
    <path d="M60,180 l24,-50 l24,50 z" opacity="0.85"/>
  </g>
  <circle cx="84" cy="120" r="6" fill="#c96f4a"/>
  <circle cx="70" cy="150" r="5" fill="#d9a441"/>

  <!-- candle -->
  <g>
    <rect x="190" y="120" width="24" height="60" rx="4" fill="#fbf6ef"/>
    <path d="M202,120 q-10,-14 0,-24 q10,10 0,24 z" fill="#d9a441"/>
    <ellipse cx="202" cy="98" rx="6" ry="10" fill="#c96f4a" opacity="0.8"/>
  </g>

  <!-- baubles -->
  <g>
    <circle cx="300" cy="130" r="20" fill="#c96f4a"/>
    <circle cx="340" cy="160" r="16" fill="#d9a441"/>
    <circle cx="290" cy="170" r="12" fill="#a85635"/>
    <rect x="296" y="106" width="8" height="10" fill="#454f37"/>
  </g>
</svg>
