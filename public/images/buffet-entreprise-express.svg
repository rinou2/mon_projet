<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="menuEntrepriseTitle">
  <title id="menuEntrepriseTitle">Illustration du menu Buffet Entreprise Express</title>
  <defs>
    <linearGradient id="bgEntreprise" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3ead9"/>
      <stop offset="100%" stop-color="#ecd8a6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="210" fill="url(#bgEntreprise)"/>
  <circle cx="360" cy="170" r="60" fill="#d9a441" opacity="0.15"/>

  <!-- briefcase -->
  <g>
    <rect x="60" y="90" width="110" height="76" rx="10" fill="#a85635"/>
    <rect x="95" y="76" width="40" height="20" rx="6" fill="none" stroke="#a85635" stroke-width="8"/>
    <rect x="60" y="118" width="110" height="14" fill="#8a4429"/>
    <rect x="106" y="112" width="18" height="26" rx="3" fill="#d9a441"/>
  </g>

  <!-- tray with sandwiches -->
  <g>
    <ellipse cx="270" cy="150" rx="80" ry="16" fill="#fbf6ef"/>
    <rect x="220" y="128" width="34" height="18" rx="3" fill="#e8b98a"/>
    <rect x="220" y="128" width="34" height="6" fill="#5c6b4a"/>
    <rect x="262" y="128" width="34" height="18" rx="3" fill="#e8b98a"/>
    <rect x="262" y="128" width="34" height="6" fill="#c96f4a"/>
    <rect x="304" y="128" width="34" height="18" rx="3" fill="#e8b98a"/>
    <rect x="304" y="128" width="34" height="6" fill="#5c6b4a"/>
  </g>

  <!-- coffee cup -->
  <g>
    <path d="M55,175 h34 v14 a17,14 0 0 1 -34,0 z" fill="#fbf6ef"/>
    <path d="M89,178 q14,0 14,10 q0,10 -14,10" fill="none" stroke="#fbf6ef" stroke-width="5"/>
    <path d="M60,166 q4,-8 -2,-14" fill="none" stroke="#c9915f" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
